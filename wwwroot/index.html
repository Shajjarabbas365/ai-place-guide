```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Place Guide</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
          rel="stylesheet" />

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        :root {
            --bg: #0b0f1a;
            --glass: rgba(16, 20, 33, .78);
            --line: rgba(255, 255, 255, .09);
            --text: #e8ecf6;
            --muted: #8b94ab;
            --accent: #7c9cff;
            --accent2: #b07cff;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: Inter, system-ui, sans-serif;
        }

        #map {
            position: absolute;
            inset: 0;
            background: var(--bg);
        }

        .glass {
            background: var(--glass);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid var(--line);
            border-radius: 18px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, .45);
        }

        /* Top section: brand and search */
        .topbar {
            position: absolute;
            z-index: 1200;
            top: 16px;
            left: 16px;
            width: min(460px, calc(100% - 32px));
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 0 4px 10px;
        }

        .logo {
            width: 30px;
            height: 30px;
            border-radius: 9px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            box-shadow: 0 6px 18px rgba(124, 156, 255, .45);
        }

        .brand b {
            font-size: 16px;
            letter-spacing: .2px;
            display: block;
        }

        .brand small {
            color: var(--muted);
            font-size: 11.5px;
        }

        .search {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px;
        }

            .search input {
                flex: 1;
                min-width: 0;
                background: transparent;
                border: 0;
                outline: 0;
                color: var(--text);
                font: 500 15px Inter, sans-serif;
                padding: 10px 8px;
            }

                .search input::placeholder {
                    color: var(--muted);
                }

        .icon-btn {
            border: 0;
            background: rgba(255, 255, 255, .06);
            color: var(--text);
            width: 40px;
            height: 40px;
            border-radius: 12px;
            cursor: pointer;
            display: grid;
            place-items: center;
            transition: background .2s, transform .1s;
        }

            .icon-btn:hover {
                background: rgba(255, 255, 255, .13);
            }

            .icon-btn:active {
                transform: scale(.95);
            }

            .icon-btn.go {
                background: linear-gradient(135deg, var(--accent), var(--accent2));
            }

            .icon-btn:disabled {
                opacity: .4;
                cursor: not-allowed;
            }

        .results {
            margin-top: 8px;
            padding: 6px;
            max-height: 300px;
            overflow: auto;
        }

            .results[hidden] {
                display: none;
            }

            .results button {
                display: block;
                width: 100%;
                text-align: left;
                background: transparent;
                border: 0;
                color: var(--text);
                padding: 10px 12px;
                border-radius: 12px;
                cursor: pointer;
                font: 500 14px Inter, sans-serif;
            }

                .results button:hover {
                    background: rgba(255, 255, 255, .07);
                }

                .results button span {
                    display: block;
                    color: var(--muted);
                    font-weight: 400;
                    font-size: 12.5px;
                    margin-top: 2px;
                    white-space: nowrap;
                    overflow: hidden;
                    text-overflow: ellipsis;
                }

            .results .note {
                padding: 12px;
                color: var(--muted);
                font-size: 13.5px;
            }

        /* Side panel */
        .panel {
            position: absolute;
            z-index: 1200;
            top: 16px;
            right: 16px;
            bottom: 16px;
            width: 380px;
            padding: 22px;
            overflow: auto;
        }

        .empty {
            height: 100%;
            display: grid;
            place-content: center;
            text-align: center;
            color: var(--muted);
            gap: 10px;
        }

            .empty .orb {
                width: 64px;
                height: 64px;
                border-radius: 20px;
                margin: 0 auto 6px;
                background: linear-gradient(135deg, var(--accent), var(--accent2));
                opacity: .9;
                box-shadow: 0 10px 30px rgba(124, 156, 255, .4);
            }

            .empty h3 {
                margin: 0;
                color: var(--text);
                font-size: 18px;
            }

            .empty p {
                margin: 0;
                font-size: 14px;
                line-height: 1.5;
            }

        [hidden] {
            display: none !important;
        }

        h2 {
            margin: 0;
            font-size: 22px;
            line-height: 1.25;
        }

        .sub {
            color: var(--muted);
            font-size: 14px;
            margin-top: 4px;
            min-height: 18px;
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 16px 0;
        }

        .chip {
            font-size: 12px;
            font-weight: 600;
            padding: 6px 10px;
            border-radius: 999px;
            background: rgba(124, 156, 255, .14);
            color: var(--accent);
            border: 1px solid rgba(124, 156, 255, .25);
        }

            .chip.soft {
                background: rgba(255, 255, 255, .05);
                color: var(--muted);
                border-color: var(--line);
            }

        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin: 18px 0 10px;
        }

        .label {
            font-size: 11.5px;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: var(--muted);
            font-weight: 600;
        }

        .seg {
            display: inline-flex;
            padding: 3px;
            background: rgba(255, 255, 255, .06);
            border-radius: 12px;
        }

            .seg button {
                border: 0;
                background: transparent;
                color: var(--muted);
                font: 600 12.5px Inter, sans-serif;
                padding: 7px 14px;
                border-radius: 9px;
                cursor: pointer;
            }

                .seg button.active {
                    background: rgba(255, 255, 255, .13);
                    color: var(--text);
                }

        #guideText {
            font-size: 15px;
            line-height: 1.7;
            color: #d7dcea;
            margin: 0;
        }

        #guideError {
            color: #ffb4b4;
            background: rgba(255, 90, 90, .1);
            border: 1px solid rgba(255, 90, 90, .25);
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 14px;
        }

        .skeleton div {
            height: 12px;
            border-radius: 6px;
            margin-bottom: 10px;
            background: linear-gradient( 90deg, rgba(255, 255, 255, .06), rgba(255, 255, 255, .16), rgba(255, 255, 255, .06) );
            background-size: 200% 100%;
            animation: shimmer 1.3s infinite;
        }

            .skeleton div:nth-child(3n) {
                width: 70%;
            }

        @keyframes shimmer {
            0% {
                background-position: 200% 0;
            }

            100% {
                background-position: -200% 0;
            }
        }

        .listen {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            margin-top: 18px;
            border: 0;
            cursor: pointer;
            padding: 13px;
            border-radius: 14px;
            color: #fff;
            font: 600 14.5px Inter, sans-serif;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            box-shadow: 0 10px 24px rgba(124, 156, 255, .35);
        }

            .listen:disabled {
                opacity: .4;
                cursor: not-allowed;
                box-shadow: none;
            }

        .places {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

            .places a {
                text-decoration: none;
            }
        .leaflet-tile-pane {
            filter: invert(1) hue-rotate(200deg) brightness(.85) contrast(.9) saturate(.7);
        }

        .leaflet-control-zoom a {
            background: var(--glass) !important;
            color: var(--text) !important;
            border-color: var(--line) !important;
            backdrop-filter: blur(12px);
        }

        .leaflet-control-attribution {
            background: rgba(11, 15, 26, .7) !important;
            color: var(--muted) !important;
        }

            .leaflet-control-attribution a {
                color: var(--muted) !important;
            }

        @media (max-width: 760px) {
            .panel {
                top: auto;
                left: 12px;
                right: 12px;
                bottom: 12px;
                width: auto;
                max-height: 46vh;
                padding: 18px;
            }

            .topbar {
                left: 12px;
                width: calc(100% - 24px);
            }

            .leaflet-bottom.leaflet-right {
                display: none;
            }
        }
    </style>
</head>

<body>

    <div id="map"></div>

    <div class="topbar">

        <div class="brand">
            <div class="logo"></div>

            <div>
                <b>AI Place Guide</b>
                <small>Prototype inspired by Cubish</small>
            </div>
        </div>

        <div class="glass search">

            <input id="q"
                   type="text"
                   placeholder="Search a city, country or place…"
                   autocomplete="off" />

            <button class="icon-btn"
                    id="locate"
                    title="Use my location"
                    aria-label="Use my location">
                <svg width="18"
                     height="18"
                     viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2"
                     stroke-linecap="round">
                    <circle cx="12" cy="12" r="3" />
                    <circle cx="12" cy="12" r="7" />
                    <path d="M12 2v3" />
                    <path d="M12 19v3" />
                    <path d="M2 12h3" />
                    <path d="M19 12h3" />
                </svg>
            </button>

            <button class="icon-btn go"
                    id="searchBtn"
                    title="Search"
                    aria-label="Search">
                <svg width="18"
                     height="18"
                     viewBox="0 0 24 24"
                     fill="none"
                     stroke="#fff"
                     stroke-width="2.2"
                     stroke-linecap="round">
                    <circle cx="11" cy="11" r="7" />
                    <path d="m20 20-3.5-3.5" />
                </svg>
            </button>

        </div>

        <div class="glass results" id="results" hidden></div>

    </div>

    <aside class="glass panel">

        <div class="empty" id="empty">

            <div>

                <div class="orb"></div>

                <h3>Explore any place</h3>

                <p>
                    Click anywhere on the map, or search for a city or country,
                    to see its cube and an AI visitor guide.
                </p>

            </div>

        </div>

        <div id="content" hidden>

            <h2 id="placeName">…</h2>

            <div class="sub" id="placeSub"></div>

            <div class="chips">

                <span class="chip">
                    CUBE <span id="cubeId"></span>
                </span>

                <span class="chip soft" id="coords"></span>

            </div>

            <div class="row">

                <span class="label">Visitor guide</span>

                <div class="seg">

                    <button id="langEn" class="active">
                        EN
                    </button>

                    <button id="langIt">
                        IT
                    </button>

                </div>

            </div>

            <div class="skeleton" id="guideSkeleton" hidden>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
                <div></div>
            </div>

            <p id="guideText" hidden></p>

            <div id="guideError" hidden></div>

            <button class="listen" id="listen" disabled>

                <svg width="18"
                     height="18"
                     viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2"
                     stroke-linecap="round"
                     stroke-linejoin="round">
                    <path d="M11 5 6 9H3v6h3l5 4z" />
                    <path d="M15.5 8.5a5 5 0 0 1 0 7" />
                </svg>

                <span id="listenText">
                    Listen
                </span>

            </button>

            <div class="row">
                <span class="label">
                    Nearby on Wikipedia
                </span>
            </div>

            <div class="places" id="places"></div>

        </div>

    </aside>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script src="app.js"></script>

</body>
</html>
```
